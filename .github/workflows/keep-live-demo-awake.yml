name: Keep live demo awake

# Streamlit Community Cloud's free tier sleeps an app after a stretch with
# no visitors. This pings the live demo periodically so it stays warm for
# hackathon judging. Runs from main only — GitHub only fires `schedule`
# triggers from a repo's default branch.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live Streamlit app
        run: |
          curl -sS --max-time 30 -o /dev/null -w "HTTP %{http_code}\n" \
            https://coolcost-engine.streamlit.app/ || echo "Ping failed (app may be waking up) — continuing"
